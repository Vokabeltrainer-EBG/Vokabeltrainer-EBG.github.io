<style>
/* VOICE: fröhliches Comic-Farmspiel für Kinder, große Knöpfe, klare Zahlen
   IDEA: eigener Hof schräg von oben, frei verschiebbar wie eine Spielkarte

   COLOUR and TYPE: sattes Wiesengrün, Erd-Orange, Gold für Knöpfe und Taler; Fredoka mit dunkler Kontur

.out{color:#fff;text-shadow:0 2px 0 #4a2f0c,0 0 3px #4a2f0c,0 0 2px #4a2f0c;font-weight:700}

#tj .moon{position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px;border-radius:50%;background:radial-gradient(circle at 60% 40%,#fffbe8,#e8e0c0);box-shadow:-14px 6px 0 0 #1d2a5a inset,0 0 30px #fffbe8;offset-path:path('M 240 120 Q 0 -240 -240 120');animation:arc 2.6s ease-in-out forwards,mo 2.6s forwards}
@keyframes mo{0%,25%{opacity:0}45%,60%{opacity:1}80%,100%{opacity:0}}

#heroEl.walk .hs{animation:hbob .36s ease-in-out infinite}@keyframes hbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}#heroEl.walk.flip .hs{animation-name:hbobf}@keyframes hbobf{0%,100%{transform:scaleX(-1)}50%{transform:scaleX(-1) translateY(-3px)}}
#heroEl .legL,#heroEl .legR,#heroEl .armR{transform-box:fill-box;transform-origin:50% 0}
#heroEl.walk .legL{animation:lg .36s ease-in-out infinite}#heroEl.walk .legR{animation:lg .36s ease-in-out infinite reverse}@keyframes lg{0%,100%{transform:rotate(18deg)}50%{transform:rotate(-18deg)}}
#heroEl .scythe{opacity:0}#heroEl.mow .scythe{opacity:1}#heroEl.mow .armR{animation:mw .35s ease-in-out 2}@keyframes mw{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(-75deg)}}
.room{margin:-14px -16px 12px;border-bottom:4px solid #8a5631;background:#e9d2a8}.room svg{display:block;width:100%;height:auto;max-height:38vh}
.sheet.inside .sheet-in{max-height:96vh;width:min(720px,100%)}

.hroom{position:relative;margin:-14px -16px 12px;aspect-ratio:600/330;max-height:62vh;border-bottom:4px solid #8a5631;overflow:hidden}.hroom>svg{position:absolute;inset:0;width:100%;height:100%}

.note{position:relative;width:29%;min-width:84px;min-height:44%;background:#fffdf3;border:0;font:inherit;color:var(--ink);padding:16px 6px 6px;transform:rotate(var(--r));box-shadow:0 4px 6px rgba(0,0,0,.25);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;line-height:1.2}

.note b{font-size:12px}.note .ni{display:flex;gap:2px;align-items:center;flex-wrap:wrap;justify-content:center;font-weight:700;font-size:13px}.note .ni svg{width:26px;height:26px}.note .price .ico{width:16px;height:16px}

.hin{position:relative;width:min(100%,58vh);aspect-ratio:1;background-size:100% 100%}
.board2{position:absolute;left:24.5%;right:25.3%;top:18%;bottom:44.5%;display:flex;flex-wrap:wrap;gap:3%;justify-content:center;align-content:center;padding:2%}

.tw{transform-box:fill-box;transform-origin:50% 100%;animation:tw 5s ease-in-out infinite}@keyframes tw{50%{transform:rotate(1.3deg)}}
.act{position:absolute;left:0;top:0;pointer-events:none;will-change:transform}.act img{position:absolute;left:0;bottom:0;width:100%;height:100%}.act.flip img{transform:scaleX(-1)}
.act.mv img{animation:abob .32s ease-in-out infinite}.act.flip.mv img{animation-name:abobf}@keyframes abob{50%{transform:translateY(-2px)}}@keyframes abobf{0%,100%{transform:scaleX(-1)}50%{transform:scaleX(-1) translateY(-2px)}}

#light{position:absolute;left:-300px;top:-160px;width:2180px;height:1520px;pointer-events:none;z-index:2900;background:linear-gradient(135deg,rgba(255,240,190,.2),rgba(255,240,190,0) 45%,rgba(20,40,10,0) 60%,rgba(20,40,10,.2));will-change:transform}
#heroEl::before{content:'';position:absolute;left:30%;right:-12%;bottom:-2px;height:11px;border-radius:50%;background:radial-gradient(closest-side,rgba(25,50,8,.45),transparent);transform:skewX(-35deg);filter:blur(1.5px)}
.cbar{display:inline-block;width:120px;height:14px;border-radius:7px;background:rgba(0,0,0,.25);border:2px solid #fff;overflow:hidden;box-shadow:0 2px 0 #4a2f0c;vertical-align:middle}.cbar i{display:block;height:100%;background:linear-gradient(#ffd84a,#e0a21c)}

.items{display:flex;flex-wrap:wrap;gap:4px 14px;margin:4px 0 8px}
.it{display:flex;align-items:center;gap:3px;white-space:nowrap;font-weight:600}
.it.miss{color:var(--red)}.it.have{color:var(--ok)}
.opt{display:flex;align-items:center;gap:10px;width:100%;font:inherit;text-align:left;border:3px solid var(--line);background:#fffdf3;color:var(--ink);border-radius:14px;padding:6px 12px;min-height:64px;cursor:pointer;margin-bottom:8px}
.opt:disabled{opacity:.4;cursor:default}
.ok{color:var(--ok);font-weight:700}
.test label{display:flex;align-items:center;gap:8px}
.test input{font:inherit;font-size:16px;width:80px;min-height:44px;border-radius:10px;border:2px solid var(--line);padding:4px 8px;background:#fff;color:var(--ink)}
#toast{position:fixed;left:50%;top:80px;transform:translate(-50%,-20px);opacity:0;background:rgba(40,25,5,.88);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;transition:.25s;z-index:20;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.fly{position:fixed;left:-18px;top:-18px;width:36px;height:36px;z-index:30;pointer-events:none}
.fly svg{width:100%;height:100%}
#tj{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:linear-gradient(#7cc8f0,#bfe8ff);animation:sky 2.6s ease-in-out forwards}
#tj[hidden]{display:none}
@keyframes sky{0%{opacity:0}12%{opacity:1;background:#7cc8f0}45%{background:#1d2a5a}75%{background:#f7a35c}88%{opacity:1}100%{opacity:0;background:#7cc8f0}}
#tj .orb{position:absolute;left:50%;top:50%;width:90px;height:90px;margin:-45px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff7b0,#ffd23f 60%,#f5a400);box-shadow:0 0 40px #ffe27a;offset-path:path('M -260 120 Q 0 -260 260 120');animation:arc 2.6s ease-in-out forwards}
@keyframes arc{from{offset-distance:0%}to{offset-distance:100%}}
#tj b{position:relative;font-size:clamp(30px,7vw,48px)}
@media(max-width:600px){.pill{font-size:19px}.pill svg{width:30px;height:30px}.rb .c{width:64px;height:64px}.rb .c svg{width:38px;height:38px}#tbub{bottom:100px}}
#weather{display:none}.tw,.sw,.pk,.gl,.act.mv img{animation:none!important}.fbr{will-change:transform}.hl{animation:none;filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 8px #ffd84a)}
@media(prefers-reduced-motion:reduce){.tw,#heroEl svg,#heroEl .legL,#heroEl .legR,#heroEl .armR,#weather,.pk,.fbr,.smk,.gl,.cloud,.sw,.hl,#arrow,.pop,.sheet-in,.bump{animation:none}}

.hroom2{position:relative;overflow:hidden}.hroom2{background:repeating-linear-gradient(90deg,#6e4122 0 36px,#5b3419 36px 39px)}.hin{box-shadow:0 0 0 5px #8a5631,0 0 22px rgba(0,0,0,.55)}
.hin{width:min(100%,66vh)}
.board2{gap:5% 3%}
.board2 .note,.board2 .note{width:30%;padding:13px 3px 6px;font-size:14px;gap:2px}
.board2 .note .ni{font-size:15px;gap:1px}.board2 .note .ni svg{width:26px;height:26px}.board2 .note .price{font-size:13px}
.board2 .note.ok::after{right:-9px;top:-9px;width:20px;height:20px;font-size:12px}
.board2 .note.empty{font-size:13px;color:#5a4526;padding:12px 4px;justify-content:center}
@media(max-width:600px){.board2 .note{font-size:12px}.board2 .note .ni svg{width:20px;height:20px}}
.rimg{aspect-ratio:600/250;max-height:34vh;width:100%;background-size:cover}
.obj:active>svg{filter:brightness(1.12)}
#fade{position:fixed;inset:0;background:#2f4a1a;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9000}#fade.on{opacity:1}
#grid{position:absolute;left:0;top:0;width:0;height:0;z-index:1}.obj.msel>svg{filter:drop-shadow(0 0 6px #ffd84a) drop-shadow(0 0 3px #fff)}body.edit #dock,body.edit #goal{display:none}body.edit .obj.msel{touch-action:none}body.edit .fb{pointer-events:none;opacity:.5}
.note .chain{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:#c0392b;color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;white-space:nowrap}
body.edit.hassel #map{touch-action:none}
.wkback:not([hidden]){opacity:1!important;text-decoration:none;display:inline-flex;align-items:center;border-style:solid;min-height:44px;margin-right:16px}
.gate .go{display:none}.gate.open .go{display:inline}.gate.open .gc{display:none}
.obj[data-act=tree]::after{content:'';position:absolute;inset:0}
</style>

  const x0=a.left+a.width*(.3+Math.random()*.4),y0=a.top+a.height*(.3+Math.random()*.3),x1=b.left+b.width/2,y1=b.top+b.height/2;
  el.animate([{transform:`translate(${x0}px,${y0}px) scale(.5)`,opacity:0},{transform:`translate(${x0+(Math.random()-.5)*60}px,${y0-70}px) scale(1.15)`,opacity:1,offset:.35},{transform:`translate(${x1}px,${y1}px) scale(.55)`,opacity:.9}],{duration:750+k*90,easing:'ease-in',fill:'forwards'}).onfinish=()=>el.remove()}}
function burst(rc,syms,n,txt){if(RM||!rc)return;const cx=rc.left+rc.width/2,cy=rc.top+rc.height*.45;
 for(let k=0;k<n;k++){const el=document.createElement('div');el.className='fly';el.innerHTML=ico(syms[k%syms.length],'');document.body.appendChild(el);const a=k/n*Math.PI*2,d=55+Math.random()*45;
  el.animate([{transform:`translate(${cx}px,${cy}px) scale(.3)`,opacity:1},{transform:`translate(${cx+Math.cos(a)*d}px,${cy+Math.sin(a)*d*.6-30}px) scale(.75) rotate(${rnd(360)}deg)`,opacity:0}],{duration:750,easing:'cubic-bezier(.2,.8,.4,1)'}).onfinish=()=>el.remove()}
 if(txt){const t=document.createElement('div');t.className='ft out';t.textContent=txt;document.body.appendChild(t);
  t.animate([{transform:`translate(${cx}px,${cy-10}px) translateX(-50%) scale(.6)`,opacity:0},{transform:`translate(${cx}px,${cy-40}px) translateX(-50%) scale(1.1)`,opacity:1,offset:.25},{transform:`translate(${cx}px,${cy-90}px) translateX(-50%) scale(1)`,opacity:0}],{duration:1300,easing:'ease-out'}).onfinish=()=>t.remove()}}

 if(S.up.truck){if(S.truck&&S.plays>S.truck.until){S.truck.items.forEach(c=>{S.inv[c.g]=have(c.g)+c.f});S.truck=null;S.nextTruck=S.plays+1;setTimeout(()=>toast('Der Lieferwagen ist ohne volle Kisten weitergefahren. Deine Waren sind zurück im Lager.'),1500)}
  if(!S.truck&&S.plays>=S.nextTruck){const pool=wantGoods().filter(g=>g!=='giant'&&g!=='feed').sort(()=>Math.random()-.5).slice(0,3);const items=pool.map(g=>({g,q:Math.round((3+rnd(4))*(1+.06*(S.lv-1))),f:0}));const val=items.reduce((a,c)=>a+c.q*price(c.g),0);S.truck={items,reward:Math.round(val*2.5/10)*10,until:S.plays+1};setTimeout(()=>toast('Der Lieferwagen ist da! Fülle seine Kisten.'),1500)}}let g=0;S.fields.forEach(f=>{if(f.c){f.g++;g++}});(S.trees||[]).forEach(t=>{if(t.k){t.g++;g++}});

 drive:()=>{const t=S.truck;if(!canAct()||!t||!t.items.every(c=>c.f>=c.q))return;const rc=rectOf(document.querySelector('[data-act=drive]'));const L0=lvOf(S.xp);
  S.coins+=t.reward;S.xp+=Math.floor(t.reward/10)*2;S.badges++;S.truck=null;S.nextTruck=S.plays+3;burst(rc,['star','coin','crate'],18,`+${t.reward}`);fly('coin',rc,$('pCoin'),8);hideSheet();toast(`Der Lieferwagen fährt los! +${t.reward} Taler · Abzeichen Nr. ${S.badges}`);render();if(lvOf(S.xp)>L0)setTimeout(()=>levelUp(lvOf(S.xp)),RM?0:900)},

 sell:d=>{if(!canAct())return;const n=d.n==='all'?av(d.g):Math.min(1,av(d.g));if(!n)return;const rc=rectOf(document.querySelector(`[data-act=sell][data-g="${d.g}"]`));S.inv[d.g]-=n;S.coins+=n*mprice(d.g);fly('coin',rc,$('pCoin'),Math.min(5,n));toast(`+${n*mprice(d.g)} Taler`);render()},
 tree:d=>{const i=+d.i,t=S.trees[i];if(!t)return;const [x,y]=TREEP[i];walkTo(x-60,y+30);if(!canAct())return locked();
  if(!t.k)return sheet(frame('Welchen Baum pflanzen?',Object.entries(TREES).map(([k,T])=>`<button class="opt" data-act="plantTree" data-i="${i}" data-k="${k}" ${S.seeds>=T.seed?'':`aria-disabled="true" data-why="Dir fehlen noch ${T.seed-S.seeds} Samen."`}>${ico(T.out,'big')}<span class="grow"><b>${T.de}</b><br><span class="small mute">trägt nach ${T.r} Spielrunden, dann ${T.h}× je ${dq(T.out,T.y)}</span></span>${seedc(T.seed)}</button>`).join('')),'plant');
  const T=TREES[t.k];if(t.g<T.r)return toast(`${T.de}: ${t.h?'neue Früchte':'trägt'} in ${T.r-t.g} Spielrunde${T.r-t.g>1?'n':''}`);
  const rc=rectOf($('o-t'+i));S.inv[T.out]=have(T.out)+T.y;t.h++;S.xp++;if(t.h>=T.h){S.trees[i]={k:null,g:0,h:0};toast(`+${dq(T.out,T.y)} · der Baum ist abgeerntet`)}else{t.g=T.r-1;toast(`+${dq(T.out,T.y)}`)}burst(rc,['star',T.out],8,'');fly(T.out,rc,$('dStore'),3);render()},
 plantTree:d=>{const i=+d.i,T=TREES[d.k];if(!canAct()||!T||S.seeds<T.seed||S.trees[i].k)return;S.seeds-=T.seed;S.trees[i]={k:d.k,g:0,h:0};hideSheet();toast(`${T.de} gepflanzt`);render()},
 press:d=>{if(!canAct())return;const n=d.n==='all'?Math.floor(have('apple')/3):1;if(!n||have('apple')<3*n)return;S.inv.apple-=3*n;S.inv.juice=have('juice')+n;toast(`+${dq('juice',n)}`);render()},
 jamCook:d=>{if(!canAct())return;const n=d.n==='all'?Math.min(Math.floor(have('cherry')/2),have('sugar')):1;if(!n||have('cherry')<2*n||have('sugar')<n)return;S.inv.cherry-=2*n;S.inv.sugar-=n;S.inv.jam=have('jam')+n;toast(`+${dq('jam',n)}`);render()},
 feedMill:d=>{if(!canAct())return;const n=d.n==='all'?av('corn'):1;if(!n||av('corn')<n)return;S.inv.corn-=n;S.inv.feed=have('feed')+2*n;toast(`+${dq('feed',2*n)}`);render()},
 boil:d=>{if(!canAct())return;const n=d.n==='all'?Math.floor(have('beet')/2):1;if(!n||have('beet')<2*n)return;S.inv.beet-=2*n;S.inv.sugar=have('sugar')+n;toast(`+${dq('sugar',n)}`);render()},
 mill:d=>{if(!canAct())return;const n=d.n==='all'?Math.floor(have('wheat')/2):1;if(!n||have('wheat')<2*n)return;S.inv.wheat-=2*n;S.inv.flour=have('flour')+n;toast(`+${dq('flour',n)}`);render()},
 seedUp:d=>{const k=d.k;if(!canAct()||!S.crops.includes(k)||slv(k)>=2||S.coins<sUp(k))return;S.coins-=sUp(k);S.seedLv=S.seedLv||{};S.seedLv[k]=slv(k)+1;toast(`${CROPS[k].de}: Saat Stufe ${slv(k)+1} – mehr Ernte pro Feld`);sheet(shopHTML(),'shop');render()},
 buyField:()=>{if(!canAct())return locked();if(S.fields.length>=MAXF)return;const p=fp();if(S.coins<p)return toast(`Du brauchst ${p} Taler.`);S.coins-=p;const n=S.fields.length,sp=freeFieldSpot(n);if(!sp)return toast('Kein Platz mehr – stell erst etwas um.');S.pos['f'+n]=sp;syncLayout();S.fields.push(empty());popId='o-f'+n;toast('Neues Feld!');render()},
 buySlot:()=>{if(!canAct()||!S.house)return;const p=sp();if(S.coins<p)return;S.coins-=p;S.slots++;toast(`Ab dem nächsten Spielen ${S.slots} Aufträge`);render()},
 unlock:d=>{const v=CROPS[d.k];if(!canAct()||S.coins<v.u||S.crops.includes(d.k)||S.lv<v.lv)return;S.coins-=v.u;S.crops.push(d.k);toast(`${v.de} freigeschaltet`);render()},
 upgrade:d=>{const k=d.k;if(!canAct()||!S.up[k]||!STG[k]||stg(k)>=3||S.coins<stgCost(k)||S.seeds<stgSeed(k))return;S.coins-=stgCost(k);S.seeds-=stgSeed(k);S.lvl[k]=stg(k)+1;popId='o-'+k;toast(`${UPS[k].n} ist jetzt Stufe ${S.lvl[k]}`);sheet(shopHTML(),'shop');render()},
 buyUp:d=>{const v=UPS[d.k];if(!canAct()||S.up[d.k]||S.coins<v.c||S.lv<v.lv||(v.need&&!v.need()))return;S.coins-=v.c;S.up[d.k]=true;popId='o-'+d.k;hideSheet();toast(`${v.n} gebaut`);render()},
 tutNext:()=>{hideSheet();S.tut=S.house?2:1;if(S.house&&!S.orders.some(o=>o.tut)){S.orders.unshift(tutOrder());if(S.orders.length>S.slots)S.orders.pop()}if(S.tut===2)seedGift();lastStep=-1;render()},
 tutDone:()=>{S.tut=null;S.tutDone=true;hideSheet();render()},
 learn:()=>{const e=Math.max(0,Math.floor(+($('easy')?.value)||0)),h=Math.max(0,Math.floor(+($('hard')?.value)||0));tE=e;tH=h;
  let half=0;for(let k=0;k<e+h;k++){const v=k<e?1:2;half+=S.ans<CAP?v*2:v;S.ans++}
  S.frac+=half;const s=Math.floor(S.frac/2);S.frac-=s*2;S.seeds+=s;
  let msg=`+${s} Samen`;if(!S.learned){S.learned=true;S.parcels=Math.min(3,S.parcels+1);msg+=' · ein Paket ist angekommen'}
  if(!S.unlocked&&!S.playing){S.cnt=Math.min(GOAL,S.cnt+e+h);if(S.cnt>=GOAL){S.unlocked=true;msg+=' · Farm freigeschaltet!'}}toast(msg);render()},
 nextDay:()=>{if(S.playing)endSession();S.day++;S.learned=false;S.ans=0;toast(`Tag ${S.day}`);render()},
 cheatUnlock:()=>{S.unlocked=true;render()},
 cheatAll:()=>{S.zones.mill=true;PATHS=ZPATH[Z]();PATHP=PATHS[0];$('ground').innerHTML=ground();gdynKey='';S.tut=null;S.tutDone=true;S.gift=true;S.house=true;S.xp=Math.max(S.xp,LVN(11));S.crops=Object.keys(CROPS);for(const k in UPS)if(zoneOf(k)!=='vieh')S.up[k]=1;for(const k in DEKO)S.deko[k]=1;while(S.fields.length<8){const n=S.fields.length,sp=freeFieldSpot(n);if(!sp)break;S.pos['f'+n]=sp;syncLayout();S.fields.push(empty())}S.slots=Math.max(S.slots,5);S.coins+=1000;S.seeds+=300;S.unlocked=true;fillOrders();closeSheet&&closeSheet();render();toast('Alles freigeschaltet')},
 cheatCoins:()=>{S.coins+=100;render()},

 resetAsk:()=>sheet(frame('Zurücksetzen?',`<p>Die Farm startet dann von vorn.</p><div class="row"><button class="btn" data-act="reset">Zurücksetzen</button><button class="btn alt" data-act="close">Abbrechen</button></div>`)),

};

map.addEventListener('pointerdown',e=>{const t=e.target.closest('[data-act=field]');
 if(t&&canAct()&&(S.tut==null||S.tut===4)&&ready(S.fields[+t.dataset.i]||{})){pend={el:t,x:e.clientX,y:e.clientY};return}
 if(e.pointerType!=='mouse')return;dn={x:e.clientX,y:e.clientY,l:map.scrollLeft,t:map.scrollTop};moved=false});
addEventListener('pointermove',e=>{if(pend&&!sweeping&&Math.hypot(e.clientX-pend.x,e.clientY-pend.y)>12){sweeping=true;moved=true;sk.hidden=RM;sweepHit(pend.el)}
 if(sweeping){skMove(e);const el=document.elementFromPoint(e.clientX,e.clientY),t=el&&el.closest('[data-act=field]');if(t)sweepHit(t);return}
 if(!dn)return;const dx=e.clientX-dn.x,dy=e.clientY-dn.y;if(Math.abs(dx)+Math.abs(dy)>6)moved=true;if(moved){map.scrollLeft=dn.l-dx;map.scrollTop=dn.t-dy}});
const endSweep=()=>{pend=null;if(sweeping){sweeping=false;sk.hidden=true}dn=null;setTimeout(()=>moved=false,0)};
addEventListener('pointerup',endSweep);addEventListener('pointercancel',endSweep);
document.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault();return}
 if(edit&&e.target.closest('#world')&&!e.target.closest('[data-act=editDone]')){e.stopPropagation();e.preventDefault();if(noClick)return;return edTap(e)}
 if(e.target.id==='sheet'){if(sheetName&&sheetName!=='album'||$('sheet').classList.contains('inside'))return;return act.close()}
 const b=e.target.closest('[data-act]');
 if(!b){if(e.target.closest('#world')&&$('sheet').hidden){const r=$('wi').getBoundingClientRect(),zz=r.width/1500;walkTo((e.clientX-r.left)/zz,(e.clientY-r.top)/zz)}return}
 if(b.disabled)return;if(b.getAttribute('aria-disabled')){toast(whyNot(b));return}const a=b.dataset.act,f=act[a];if(!f)return;
 const key=a+JSON.stringify(b.dataset),now=Date.now();if(!NODEB.has(a)){if(key===lastKey&&now-lastT<450)return;lastKey=key;lastT=now}
 if(S.tut>=1&&S.tut<=5&&canAct()&&!ALWAYS.has(a)&&!TUT[S.tut].ok(a,b.dataset))return toast('Folge erst der Anleitung.');

{const r=seeded(3);let w='<svg viewBox="0 0 1500 1100" width="1500" height="1100"><rect width="1500" height="1100" fill="#eef6ff" opacity=".28"/>';for(let i=0;i<40;i++)w+=`<ellipse cx="${r()*1500}" cy="${r()*1100}" rx="${40+r()*110}" ry="${18+r()*40}" fill="#fff" opacity=".7"/>`;$('snow').innerHTML=w+'</svg>'}

if(Z==='farm'){map.scrollLeft=1095*z-innerWidth/2;map.scrollTop=835*z-innerHeight/2}else{const c=Z==='vieh'?[1250,920]:Z==='obst'?[1050,820]:[850,880];map.scrollLeft=c[0]*z-innerWidth/2;map.scrollTop=c[1]*z-innerHeight/2}
if(WK){$('tbtnTest').hidden=!/[?&]test/.test(location.search);$('wkBack').hidden=false}
if(INBOX){let ib={};try{ib=JSON.parse(localStorage.getItem(INBOX)||'{}')||{}}catch(e){}
 const days=Object.keys(ib).sort();if(days.length){if(S.playing&&S.playDay&&days.some(d=>d>S.playDay))endSession();let seeds=0,got=0;
  for(const d of days){const {e=0,h=0}=ib[d]||{};if(S.dayStr!==d){S.dayStr=d;S.day++;S.learned=false;S.ans=0}
   let half=0;for(let k=0;k<e+h;k++){const v=k<e?1:2;half+=S.ans<CAP?v*2:v;S.ans++}S.frac+=half;const sd=Math.floor(S.frac/2);S.frac-=sd*2;S.seeds+=sd;seeds+=sd;got+=e+h;
   if(!S.learned){S.learned=true;S.parcels=Math.min(3,S.parcels+1)}
   if(!S.unlocked&&!S.playing){S.cnt=Math.min(GOAL,S.cnt+e+h);if(S.cnt>=GOAL)S.unlocked=true}}
  try{localStorage.removeItem(INBOX)}catch(e){}save();render();setTimeout(()=>toast(`Fürs Lernen: +${seeds} Samen`+(S.unlocked&&!S.playing?' · Farm freigeschaltet!':'')),900)}}
welcome();
if(/[?&]test/.test(location.search)||!WK)window.__F={get S(){return S},act,av,have,resv,nextZ,goal,newOrder,goZone,hideSheet,render,setZone};
